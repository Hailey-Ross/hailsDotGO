<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlexDex: Updating</title>
  <script>
  // Light or dark from the visitor's saved Field Kit setting (same key as the site), else the system.
  (function () {
    var m = "system", r = document.documentElement;
    try { var s = JSON.parse(localStorage.getItem("flexdex-fieldkit") || "null"); if (s && s.mode) m = s.mode; } catch (e) {}
    var h = new Date().getHours();
    var dark = m === "dark" ? true : m === "light" ? false : m === "sun" ? (h < 5 || h >= 21) : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    r.setAttribute("data-mode", dark ? "dark" : "light");
  })();
  </script>
  <style>
    /* Self-contained on purpose: this page is shown while the app is down, so it cannot lean on
       the app's stylesheets. Same Field Kit look: a field card on a calm background. */
    @font-face { font-family: 'Figtree'; font-weight: 300 900; font-display: swap; src: url(/static/fonts/figtree-latin.woff2) format('woff2'); }
    @font-face { font-family: 'Bricolage Grotesque'; font-weight: 200 800; font-display: swap; src: url(/static/fonts/bricolage-grotesque-latin.woff2) format('woff2'); }
    :root {
      --bg: #f3f6f2; --surface: #fdfefc; --line: rgba(30, 50, 40, 0.13); --line-hi: rgba(30, 50, 40, 0.24);
      --fg: #1f2a24; --fg-2: #46564c; --fg-3: #66766b; --accent: #2f8a52; --accent-soft: rgba(47, 138, 82, 0.13);
      --shadow: 0 1px 0 rgba(30, 50, 40, 0.05), 0 14px 28px -22px rgba(20, 40, 30, 0.45);
      color-scheme: light;
    }
    :root[data-mode="dark"] {
      --bg: #161c19; --surface: #1d2521; --line: rgba(220, 240, 228, 0.1); --line-hi: rgba(220, 240, 228, 0.2);
      --fg: #ecf2ee; --fg-2: #c0ccc4; --fg-3: #95a49a; --accent: #7fd39a; --accent-soft: rgba(127, 211, 154, 0.16);
      --shadow: 0 1px 0 rgba(0, 0, 0, 0.2), 0 14px 28px -20px rgba(0, 0, 0, 0.7);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
      font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.5;
      background-image:
        radial-gradient(circle at 20% 15%, var(--accent-soft), transparent 40%),
        repeating-radial-gradient(circle at 70% 80%, transparent 0 46px, var(--line) 46px 47px, transparent 47px 92px); }
    .card { position: relative; width: min(100%, 440px); padding: 30px 26px 26px; border-radius: 24px; background: var(--surface); border: 1px solid var(--line);
      box-shadow: var(--shadow); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; animation: settle 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    .card::before { content: "Field kit"; position: absolute; top: -13px; left: 18px; height: 24px; padding: 0 11px; display: flex; align-items: center; border-radius: 9px;
      background: var(--surface); border: 1px solid var(--line); font: 500 10.5px ui-monospace, 'Cascadia Mono', Consolas, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); }
    @keyframes settle { from { opacity: 0; transform: translateY(14px) rotate(-1.2deg) scale(0.98); } }
    .logo { width: 76px; height: 76px; border-radius: 22px; display: block; box-shadow: 0 0 0 1.5px rgba(255, 200, 90, 0.32), 0 8px 18px -8px rgba(255, 170, 60, 0.6); }
    h1 { margin: 4px 0 0; font-family: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; font-weight: 750; font-size: 28px; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--fg-2); }
    .dots { display: inline-flex; gap: 6px; align-items: center; height: 18px; margin-top: 4px; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: hop 1s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .dots i:nth-child(2) { animation-delay: 0.15s; } .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes hop { 0%, 60%, 100% { transform: none; opacity: 0.5; } 30% { transform: translateY(-7px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .card, .dots i { animation: none; } }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/static/app/icons/logo.svg" alt="FlexDex">
    <h1>Updating&hellip;</h1>
    <p>FlexDex is down for a quick update.<br>This page comes back on its own in a moment.</p>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </main>
<script>
  // Reload as soon as the app answers again.
  (function () {
    function check() {
      fetch('/api/data', { cache: 'no-store' })
        .then(function (res) {
          if (res.ok && (res.headers.get('content-type') || '').indexOf('application/json') !== -1) window.location.reload();
        })
        .catch(function () {});
    }
    setInterval(check, 5000);
  })();
</script>
</body>
</html>
