{{define "title"}}Login{{end}}

{{define "content"}}
<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to track your shiny collection.</p>

    {{if .Data.Error}}
    <div class="auth-error">{{.Data.Error}}</div>
    {{end}}

    <form method="POST" action="/login" class="auth-form">
      <label class="auth-label" for="username">Username</label>
      <input class="auth-input" type="text" id="username" name="username"
             autocomplete="username" required
             value="{{if .Data.Form}}{{index .Data.Form "username"}}{{end}}">

      <label class="auth-label" for="password">Password</label>
      <input class="auth-input" type="password" id="password" name="password"
             autocomplete="current-password" required>

      {{if .Data.Form}}{{with index .Data.Form "next"}}
      <input type="hidden" name="next" value="{{.}}">
      {{end}}{{end}}

      <button type="submit" class="btn-primary auth-btn">Login</button>
    </form>

    <p class="auth-alt">Don't have an account? <a href="/register">Sign up</a></p>
  </div>
</div>
{{end}}
