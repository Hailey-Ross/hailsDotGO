{{define "title"}}{{T "trade.ui.title"}}{{end}}

{{define "pagekind"}}fieldkit{{end}}

{{define "content"}}
<section class="fk-page fk-messages">
<div class="page-header fk-msg-head">
  <h1>{{T "trade.ui.title"}}</h1>
  <p class="page-header-sub">{{T "trade.ui.sub"}}</p>
</div>

<div class="fk-msg" id="fk-msg">
  <div class="fk-seg fk-msg-tabs" id="fk-msg-tabs">
    <button type="button" data-tab="active">{{T "trade.ui.tab_active"}}<b class="fk-count" data-count="active" hidden></b></button>
    <button type="button" data-tab="requests">{{T "trade.ui.tab_requests"}}<b class="fk-count" data-count="requests" hidden></b></button>
    <button type="button" data-tab="closed">{{T "trade.ui.tab_closed"}}</button>
  </div>
  <div id="fk-msg-body" class="fk-msg-body"><div class="fk-dots" aria-hidden="true"><i></i><i></i><i></i></div></div>
</div>
</section>
{{end}}
