{{define "title"}}{{T "events.title"}}{{end}}

{{define "content"}}
<div class="page-header">
  <h1>{{T "events.title"}}</h1>
  <p>{{T "events.subtitle"}}</p>
</div>

<div id="events-app">
  <div class="loading-state">
    <div class="spinner"></div>
    <p>{{T "events.loading"}}</p>
  </div>
</div>
{{end}}

{{define "scripts"}}
<script>
const EV = {
  current:    {{T "events.current"}},
  upcoming:   {{T "events.upcoming"}},
  none:       {{T "events.none"}},
  startsIn:   {{T "events.starts_in"}},
  endsIn:     {{T "events.ends_in"}},
  starts:     {{T "events.starts"}},
  ends:       {{T "events.ends"}},
  bonuses:    {{T "events.modal.bonuses"}},
  spawns:     {{T "events.modal.spawns"}},
  shinies:    {{T "events.modal.shinies"}},
  bosses:     {{T "events.modal.bosses"}},
  spotlight:  {{T "events.modal.spotlight"}},
  research:   {{T "events.modal.research"}},
  leekduck:   {{T "events.modal.leekduck"}},
  canBeShiny: {{T "events.modal.can_be_shiny"}},
  loadingDetails: {{T "events.modal.loading_details"}},
  error:      {{T "events.error"}}
};
</script>
<script src="/static/js/events.js?v={{.AssetVersion}}"></script>
{{end}}
