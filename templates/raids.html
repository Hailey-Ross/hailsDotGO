{{define "title"}}{{T "raids.title"}}{{end}}

{{define "pagekind"}}fieldkit{{end}}

{{define "content"}}
<section class="fk-page fk-raids">
<div class="fk-head"><div><h1>{{T "raids.title"}}</h1><p>{{T "raids.subtitle"}}</p></div></div>

<div id="weather-banner-slot"></div>

<div id="raids-app">
  <div class="loading-state">
    <div class="spinner"></div>
    <p>{{T "raids.loading"}}</p>
  </div>
</div>
</section>
{{end}}

{{define "scripts"}}
<script>
const RD = {
  shinyBadge:  {{T "raids.js.shiny_badge"}},
  tierN:       {{T "raids.js.tier_n"}},
  mega:        {{T "raids.js.mega"}},
  types:       {{T "raids.js.types"}},
  checkYour:   {{T "raids.js.check_your"}},
  form:        {{T "raids.js.form"}},
  atkIv:       {{T "raids.js.atk_iv"}},
  defIv:       {{T "raids.js.def_iv"}},
  staIv:       {{T "raids.js.sta_iv"}},
  vsAll:       {{T "raids.js.vs_all"}},
  yourPokemon:   {{T "raids.js.your_pokemon"}},
  boxLoadFailed: {{T "raids.js.box_load_failed"}},
  boxLoggedOut:  {{T "raids.js.box_logged_out"}},
  boxLogIn:      {{T "raids.js.box_log_in"}},
  boxEmpty:      {{T "raids.js.box_empty"}},
  boxAdd:        {{T "raids.js.box_add"}},
  boxNoneUsable: {{T "raids.js.box_none_usable"}},
  showAll:       {{T "raids.js.show_all"}},
  showFewer:     {{T "raids.js.show_fewer"}},
  yourPokemonLoading: {{T "raids.js.your_pokemon_loading"}},
  worstDps:      {{T "raids.js.worst_dps"}},
  approxTag:     {{T "raids.js.approx_tag"}},
  approxHint:    {{T "raids.js.approx_hint"}},
  shadowTag:     {{T "raids.js.shadow_tag"}},
  movesetNote:   {{T "raids.js.moveset_note"}},
  colLevel:      {{T "raids.js.col_level"}},
  colBoss:     {{T "raids.js.col_boss"}},
  colTier:     {{T "raids.js.col_tier"}},
  maxBattles:  {{T "raids.js.max_battles"}},
  unavailable: {{T "raids.js.unavailable"}},

  // Raid rotation windows. The server decides which bosses are listed using the
  // widest reading of each window (UTC+14 through UTC-12) so nobody loses a boss
  // they can still raid; these strings say what that window means on the viewer's
  // own clock.
  windowStartsIn:  {{T "raids.js.window_starts_in"}},
  windowEarlyNote: {{T "raids.js.window_early_note"}},
  windowEndsIn:    {{T "raids.js.window_ends_in"}},
  windowUntil:     {{T "raids.js.window_until"}},
  windowEndedLocal:{{T "raids.js.window_ended_local"}},
  windowLateNote:  {{T "raids.js.window_late_note"}},
  windowLiveNow:   {{T "raids.js.window_live_now"}},
  upNext:          {{T "raids.js.up_next"}},
  upNextDetailsPending: {{T "raids.js.up_next_details_pending"}},
  upNextCount:     {{T "raids.js.up_next_count"}},
  shadowRaids:     {{T "raids.js.shadow_raids"}},

  // The weather banner moved here from the raid finder, because weather boost
  // changes the counter rankings on this page. The key keeps its raidfinder
  // namespace: it is already translated in every locale and renaming an English
  // key orphans the translator edits that point at it.
  wxSuffix:        {{T "raidfinder.weather_boost_suffix"}},

  // Field Kit specimen cards and the species field page.
  catalogNo:      {{T "raids.js.catalog_no"}},
  raidKind:       {{T "raids.js.raid_kind"}},
  maxBattleTier:  {{T "raids.js.max_battle_tier"}},
  minCp:          {{T "raids.js.min_cp"}},
  maxCp:          {{T "raids.js.max_cp"}},
  boosted:        {{T "raids.js.boosted"}},
  baseStats:      {{T "raids.js.base_stats"}},
  whereToFind:    {{T "raids.js.where_to_find"}},
  shinyAvailable: {{T "home.shiny_available"}},
  noShiny:        {{T "raids.js.no_shiny"}},
  logShiny:       {{T "raids.js.log_shiny"}},
  logged:         {{T "raids.js.logged"}},
  logFailed:      {{T "raids.js.log_failed"}},
  stampHeader:    {{T "raids.js.stamp_header"}},
  stampWord:      {{T "raids.js.stamp_word"}},
  openDex:        {{T "raids.js.open_dex"}},
  compareCalc:    {{T "raids.js.compare_calc"}}
};
// The weather endpoint needs a session, since it reads the city off the
// trainer's own profile.
const RAIDS_CTX = { loggedIn: {{if .User}}true{{else}}false{{end}} };
</script>
<script src="/static/js/raids.js?v={{.AssetVersion}}"></script>
{{end}}
