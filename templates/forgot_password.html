{{define "title"}}{{T "forgot.title"}}{{end}}

{{define "content"}}
<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">{{T "forgot.title"}}</h1>
    <p class="auth-sub">{{T "forgot.subtitle"}}</p>

    {{if .Data.Error}}
    <div class="auth-error">{{.Data.Error}}</div>
    {{end}}

    {{if .Data.Info}}
    <div class="auth-info">{{.Data.Info}}</div>
    {{else}}
    <form method="POST" action="/forgot-password" class="auth-form">
      <input type="hidden" name="gorilla.csrf.Token" value="{{.CSRFToken}}">
      <label class="auth-label" for="email">{{T "forgot.email"}}</label>
      <input class="auth-input" type="email" id="email" name="email"
             autocomplete="email" required value="{{.Data.Email}}">
      <button type="submit" class="btn-primary auth-btn">{{T "forgot.submit"}}</button>
    </form>
    {{end}}

    <p class="auth-alt"><a href="/login">{{T "forgot.back_login"}}</a></p>
  </div>
</div>
{{end}}
